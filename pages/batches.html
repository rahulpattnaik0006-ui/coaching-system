        <button type="button" id="create-btn" class="inline-flex shrink-0 items-center gap-1.5 rounded-md bg-slate-900 px-3.5 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2">

    <main class="mx-auto max-w-7xl space-y-4 px-4 py-6 sm:px-6 lg:px-8">

      <!-- Control bar -->

    <div class="flex items-start justify-between border-b border-slate-200 px-6 py-4">

    <form id="batch-form" class="flex min-h-0 flex-1 flex-col" novalidate>

        <div id="form-error" role="alert" class="hidden items-start gap-2.5 rounded-md border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-800">
          <svg class="mt-0.5 h-4 w-4 shrink-0 text-red-600" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M18 10A8 8 0 112 10a8 8 0 0116 0zm-8-4a1 1 0 00-1 1v3a1 1 0 002 0V7a1 1 0 00-1-1zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>

        <div>
          <label for="f-name" class="mb-1.5 block text-sm font-medium text-slate-700">Batch name <span class="text-red-600">*</span></label>

        </div>
        <div>

          <input id="f-subject" type="text" autocomplete="off" placeholder="e.g. Physics"
            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 disabled:bg-slate-50 disabled:text-slate-500" />
        </div>
        <div>
          <label for="f-teacher" class="mb-1.5 block text-sm font-medium text-slate-700">Teacher name <span class="text-red-600">*</span></label>
          <input id="f-teacher" type="text" autocomplete="off" placeholder="e.g. Mr. Mishra"
            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 disabled:bg-slate-50 disabled:text-slate-500" />
        </div>
        <div>
          <label for="f-time" class="mb-1.5 block text-sm font-medium text-slate-700">Schedule time <span class="text-red-600">*</span></label>
          <input id="f-time" type="text" autocomplete="off" placeholder="e.g. 07:00 AM or 04:00 PM"
            class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 disabled:bg-slate-50 disabled:text-slate-500" />
        </div>
        <div>
          <label for="f-fee" class="mb-1.5 block text-sm font-medium text-slate-700">Monthly fee (₹) <span class="text-red-600">*</span></label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-sm text-slate-500">₹</span>
            <input id="f-fee" type="number" inputmode="decimal" min="0" step="1" placeholder="0"
              class="block w-full rounded-md border border-slate-300 bg-white py-2 pl-7 pr-3 text-sm text-slate-900 placeholder-slate-400 focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 disabled:bg-slate-50 disabled:text-slate-500" />
          </div>

      <div class="flex items-center justify-end gap-2 border-t border-slate-200 bg-slate-50 px-6 py-4">
        <button type="button" id="panel-cancel" class="rounded-md border border-slate-300 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 disabled:cursor-not-allowed disabled:opacity-60">Cancel</button>

          <svg id="confirm-spinner" class="hidden h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>

  <script type="module">
    import { supabase, getUserProfile, logoutUser } from '../js/auth.js';

    /* ---------- Config ---------- */
    const REDIRECT_URL = '../index.html';
    const ALLOWED_ROLES = ['admin', 'teacher'];
    // students(count) relies on the foreign key students.batch_id -> batches.id
    const BATCH_COLUMNS = 'id, name, subject, teacher_name, schedule_time, monthly_fee, created_at, students(count)';

    /* ---------- State ---------- */
    let batches = [];
    let loadError = null;
    let isLoading = true;
    let editingId = null;
    let deleteTarget = null;
    let query = '';

    /* ---------- Elements ---------- */
    const $ = (id) => document.getElementById(id);
    const overlay = $('auth-overlay');
    const grid = $('batch-grid');
    const stateBox = $('state-box');
    const resultCount = $('result-count');
    const searchInput = $('search');
    const panel = $('panel');
    const panelBackdrop = $('panel-backdrop');
    const form = $('batch-form');
    const formError = $('form-error');
    const saveBtn = $('save-btn');

    /* ---------- Helpers ---------- */
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    const fmtFee = (n) => (n === null || n === undefined || isNaN(Number(n))) ? '—' : inr.format(Number(n));
    const studentCount = (b) => Number(b.students?.[0]?.count ?? 0);

    function toast(message, type = 'success') {
      const el = document.createElement('div');
      const isErr = type === 'error';
      el.className = 'pointer-events-auto flex items-start gap-2.5 rounded-md border bg-white px-3.5 py-3 text-sm shadow-lg ' +
        (isErr ? 'border-red-200 text-red-800' : 'border-slate-200 text-slate-800');
      el.innerHTML = (isErr
        ? '<svg class="mt-0.5 h-4 w-4 shrink-0 text-red-600" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M18 10A8 8 0 112 10a8 8 0 0116 0zm-8-4a1 1 0 00-1 1v3a1 1 0 002 0V7a1 1 0 00-1-1zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>'
        : '<svg class="mt-0.5 h-4 w-4 shrink-0 text-emerald-600" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>') +
        '<p class="flex-1 leading-5">' + esc(message) + '</p>';
      $('toasts').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    /* ---------- Sidebar (mobile) ---------- */
    const sidebar = $('sidebar');
    const navBackdrop = $('nav-backdrop');
    const openNav = () => { sidebar.classList.remove('-translate-x-full'); navBackdrop.classList.remove('hidden'); };
    const closeNav = () => { sidebar.classList.add('-translate-x-full'); navBackdrop.classList.add('hidden'); };
    $('menu-btn').addEventListener('click', openNav);
    navBackdrop.addEventListener('click', closeNav);

    /* ---------- Rendering ---------- */
    function skeletonCards() {
      const bar = (w) => '<div class="h-3.5 animate-pulse rounded bg-slate-100 ' + w + '"></div>';
      let html = '';
      for (let i = 0; i < 6; i++) {
        html += '<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm"><div class="space-y-4">' +
          bar('w-2/3') + bar('w-20') + bar('w-1/2') + bar('w-1/3') + bar('w-24') + '</div></div>';
      }
      return html;
    }

    function getFiltered() {
      const q = query.trim().toLowerCase();
      if (!q) return batches;
      return batches.filter((b) =>
        [b.name, b.subject, b.teacher_name].some((x) => String(x ?? '').toLowerCase().includes(q))
      );
    }

    function showState({ title, text, action, onAction }) {
      $('state-title').textContent = title;
      $('state-text').textContent = text;
      const btn = $('state-action');
      if (action) {
        btn.textContent = action;
        btn.classList.remove('hidden');
        btn.onclick = onAction;
      } else {
        btn.classList.add('hidden');
      }
      stateBox.classList.remove('hidden');
      stateBox.classList.add('flex');
    }

    function hideState() {
      stateBox.classList.add('hidden');
      stateBox.classList.remove('flex');
    }

    const ICON_USER = '<svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>';
    const ICON_CLOCK = '<svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
    const ICON_RUPEE = '<svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>';
    const ICON_GROUP = '<svg class="h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';

    function render() {
      if (isLoading) {
        grid.innerHTML = skeletonCards();
        hideState();
        resultCount.textContent = 'Loading batches…';
        return;
      }

      if (loadError) {
        grid.innerHTML = '';
        showState({ title: 'Could not load batches', text: loadError, action: 'Try again', onAction: loadBatches });
        resultCount.innerHTML = '&nbsp;';
        return;
      }

      const list = getFiltered();
      resultCount.textContent = 'Showing ' + list.length + ' of ' + batches.length + ' batch' + (batches.length === 1 ? '' : 'es');

      if (!list.length) {
        grid.innerHTML = '';
        if (query.trim()) {
          showState({
            title: 'No batches match your search',
            text: 'Try a different batch name, subject or teacher.',
            action: 'Clear search',
            onAction: () => { query = ''; searchInput.value = ''; render(); }
          });
        } else {
          showState({
            title: 'No batches yet',
            text: 'Create your first batch to start scheduling classes and enrolling students.',
            action: 'Create Batch',
            onAction: () => openPanel()
          });
        }
        return;
      }

      hideState();
      grid.innerHTML = list.map((b) => {
        const count = studentCount(b);
        return '<article data-id="' + esc(b.id) + '" class="flex flex-col rounded-xl border border-slate-200 bg-white shadow-sm">' +
          '<div class="flex-1 p-5">' +
            '<div class="flex items-start justify-between gap-3">' +
              '<h3 class="min-w-0 break-words text-sm font-semibold text-slate-900">' + esc(b.name) + '</h3>' +
              '<span class="shrink-0 rounded-full border border-slate-200 bg-slate-50 px-2 py-0.5 text-xs font-medium text-slate-600">' + esc(b.subject || 'General') + '</span>' +
            '</div>' +
            '<dl class="mt-4 space-y-2.5 text-sm">' +
              '<div class="flex items-center gap-2.5 text-slate-600">' + ICON_USER + '<dt class="sr-only">Teacher</dt><dd class="min-w-0 truncate">' + esc(b.teacher_name || '—') + '</dd></div>' +
              '<div class="flex items-center gap-2.5 text-slate-600">' + ICON_CLOCK + '<dt class="sr-only">Schedule</dt><dd>' + esc(b.schedule_time || '—') + '</dd></div>' +
              '<div class="flex items-center gap-2.5 text-slate-600">' + ICON_RUPEE + '<dt class="sr-only">Monthly fee</dt><dd><span class="font-medium text-slate-900">' + fmtFee(b.monthly_fee) + '</span> <span class="text-slate-400">/ month</span></dd></div>' +
              '<div class="flex items-center gap-2.5 text-slate-600">' + ICON_GROUP + '<dt class="sr-only">Enrolled students</dt><dd>' + count + ' student' + (count === 1 ? '' : 's') + ' enrolled</dd></div>' +
            '</dl>' +
          '</div>' +
          '<div class="flex items-center justify-end gap-2 border-t border-slate-200 bg-slate-50/60 px-5 py-3">' +
            '<button type="button" data-edit class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900">Edit</button>' +
            '<button type="button" data-delete class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-red-700 transition hover:border-red-200 hover:bg-red-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-600">Delete</button>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    /* ---------- Data ---------- */
    async function loadBatches() {
      isLoading = true;
      loadError = null;
      render();

      const { data, error } = await supabase
        .from('batches')
        .select(BATCH_COLUMNS)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Batches load failed:', error);
        loadError = error.message || 'Something went wrong while fetching batches.';
        batches = [];
      } else {
        batches = data || [];
      }

      isLoading = false;
      render();
    }

    /* ---------- Search ---------- */
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { query = searchInput.value; render(); }, 120);
    });

    /* ---------- Card actions ---------- */
    grid.addEventListener('click', (e) => {
      const card = e.target.closest('article[data-id]');
      if (!card) return;
      const batch = batches.find((b) => String(b.id) === card.dataset.id);
      if (!batch) return;
      if (e.target.closest('[data-edit]')) openPanel(batch);
      else if (e.target.closest('[data-delete]')) openConfirm(batch);
    });

    /* ---------- Delete confirm ---------- */
    const confirmEl = $('confirm');
    function openConfirm(batch) {
      deleteTarget = batch;
      const count = studentCount(batch);
      let text = 'This will permanently remove "' + (batch.name || 'this batch') + '". This action cannot be undone.';
      if (count > 0) {
        text += ' ' + count + ' enrolled student' + (count === 1 ? ' is' : 's are') + ' currently linked to this batch.';
      }
      $('confirm-text').textContent = text;
      confirmEl.classList.remove('hidden');
      confirmEl.classList.add('flex');
      $('confirm-cancel').focus();
    }
    function closeConfirm() {
      deleteTarget = null;
      confirmEl.classList.add('hidden');
      confirmEl.classList.remove('flex');
    }
    $('confirm-cancel').addEventListener('click', closeConfirm);
    $('confirm-backdrop').addEventListener('click', () => { if (!$('confirm-ok').disabled) closeConfirm(); });
    $('confirm-ok').addEventListener('click', async () => {
      if (!deleteTarget) return;
      const okBtn = $('confirm-ok');
      okBtn.disabled = true;
      $('confirm-cancel').disabled = true;
      $('confirm-spinner').classList.remove('hidden');

      const target = deleteTarget;
      const { error } = await supabase.from('batches').delete().eq('id', target.id);

      okBtn.disabled = false;
      $('confirm-cancel').disabled = false;
      $('confirm-spinner').classList.add('hidden');

      if (error) {
        console.error('Delete failed:', error);
        toast('Could not delete batch: ' + error.message, 'error');
        return;
      }

      batches = batches.filter((b) => b.id !== target.id);
      closeConfirm();
      render();
      toast('"' + (target.name || 'Batch') + '" was deleted.');
    });

    /* ---------- Create / Edit slide-over ---------- */
    const formFields = ['f-name', 'f-subject', 'f-teacher', 'f-time', 'f-fee'].map($);

    function setSaving(saving) {
      formFields.forEach((f) => { f.disabled = saving; });
      saveBtn.disabled = saving;
      $('panel-cancel').disabled = saving;
      $('save-spinner').classList.toggle('hidden', !saving);
      $('save-label').textContent = saving ? 'Saving…' : 'Save';
    }

    function showFormError(msg) {
      $('form-error-text').textContent = msg;
      formError.classList.remove('hidden');
      formError.classList.add('flex');
    }
    function hideFormError() {
      formError.classList.add('hidden');
      formError.classList.remove('flex');
    }

    function openPanel(batch) {
      form.reset();
      hideFormError();
      setSaving(false);

      if (batch && batch.id !== undefined) {
        editingId = batch.id;
        $('panel-title').textContent = 'Edit Batch';
        $('panel-subtitle').textContent = 'Update the details for this batch.';
        $('f-name').value = batch.name ?? '';
        $('f-subject').value = batch.subject ?? '';
        $('f-teacher').value = batch.teacher_name ?? '';
        $('f-time').value = batch.schedule_time ?? '';
        $('f-fee').value = batch.monthly_fee ?? '';
      } else {
        editingId = null;
        $('panel-title').textContent = 'Create Batch';
        $('panel-subtitle').textContent = 'Set up a new class batch.';
      }

      panelBackdrop.classList.remove('hidden');
      panel.classList.remove('translate-x-full');
      document.body.classList.add('overflow-hidden');
      setTimeout(() => $('f-name').focus(), 150);
    }
    function closePanel() {
      if (saveBtn.disabled) return;
      panel.classList.add('translate-x-full');
      panelBackdrop.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    $('create-btn').addEventListener('click', () => openPanel());
    $('panel-close').addEventListener('click', closePanel);
    $('panel-cancel').addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!confirmEl.classList.contains('hidden')) { if (!$('confirm-ok').disabled) closeConfirm(); return; }
      if (!panelBackdrop.classList.contains('hidden')) { closePanel(); return; }
      closeNav();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError();

      const name = $('f-name').value.trim();
      const subject = $('f-subject').value.trim();
      const teacher_name = $('f-teacher').value.trim();
      const schedule_time = $('f-time').value.trim();
      const feeRaw = $('f-fee').value.trim();

      if (!name) { showFormError('Batch name is required.'); $('f-name').focus(); return; }
      if (!subject) { showFormError('Subject is required.'); $('f-subject').focus(); return; }
      if (!teacher_name) { showFormError('Teacher name is required.'); $('f-teacher').focus(); return; }
      if (!schedule_time) { showFormError('Schedule time is required (e.g. 07:00 AM).'); $('f-time').focus(); return; }
      if (feeRaw === '' || isNaN(Number(feeRaw)) || Number(feeRaw) < 0) {
        showFormError('Enter a valid monthly fee (0 or more).'); $('f-fee').focus(); return;
      }
      const monthly_fee = Number(feeRaw);

      const payload = { name, subject, teacher_name, schedule_time, monthly_fee };
      setSaving(true);

      let result;
      if (editingId !== null) {
        result = await supabase.from('batches').update(payload).eq('id', editingId).select(BATCH_COLUMNS).single();
      } else {
        result = await supabase.from('batches').insert(payload).select(BATCH_COLUMNS).single();
      }
      const { data, error } = result;

      if (error) {
        console.error('Save failed:', error);
        setSaving(false);
        showFormError(error.message || 'Could not save the batch. Please try again.');
        return;
      }

      const wasEditing = editingId !== null;
      if (wasEditing) {
        batches = batches.map((b) => (b.id === data.id ? data : b));
      } else {
        batches.unshift(data);
      }

      setSaving(false);
      closePanel();
      render();
      toast('"' + name + '" was ' + (wasEditing ? 'updated.' : 'created.'));
    });

    /* ---------- Sign out ---------- */
    $('signout-btn').addEventListener('click', async () => {
      $('signout-btn').disabled = true;
      $('signout-icon').classList.add('hidden');
      $('signout-spinner').classList.remove('hidden');
      $('signout-label').textContent = 'Signing out…';
      try {
        await logoutUser();
      } catch (err) {
        console.error('Sign out failed:', err);
      } finally {
        window.location.replace(REDIRECT_URL);
      }
    });

    /* ---------- Init ---------- */
    async function init() {
      try {
        const profile = await getUserProfile();
        const role = String(profile?.role ?? '').toLowerCase();

        if (!profile || !ALLOWED_ROLES.includes(role)) {
          window.location.replace(REDIRECT_URL);
          return;
        }

        const name = profile.full_name || profile.name || profile.email || 'User';
        $('sidebar-name').textContent = name;
        $('sidebar-role').textContent = role;
        $('sidebar-avatar').textContent = name.trim().charAt(0).toUpperCase();
        overlay.remove();
      } catch (err) {
        console.error('Session verification failed:', err);
        window.location.replace(REDIRECT_URL);
        return;
      }

      await loadBatches();

      const params = new URLSearchParams(window.location.search);
      if (params.get('action') === 'new') {
        openPanel();
        params.delete('action');
        const qs = params.toString();
        history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
      }
    }

    init();
  </script>
</body>
</html>
