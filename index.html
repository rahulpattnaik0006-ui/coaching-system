<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · Coaching Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main class="flex min-h-screen flex-col items-center justify-center px-4 py-12">
    
    <!-- Branding & Logo -->
    <div class="mb-10 flex flex-col items-center text-center">
      <img src="https://ui-avatars.com/api/?name=Institute+Logo&background=0D8ABC&color=fff&size=80" id="institute-logo" alt="Institute Logo" class="mb-4 h-16 w-16 rounded-full shadow-sm">
      <h1 id="institute-name" class="text-3xl font-bold tracking-tight text-slate-900">Your Coaching Institute Name</h1>
      <p class="mt-2 text-slate-500">Welcome to the central portal. Please select your role to continue.</p>
    </div>

    <div class="w-full max-w-5xl">
      
      <!-- Role Selection Cards -->
      <div id="role-selection" class="grid grid-cols-1 gap-6 md:grid-cols-3">
        
        <!-- Student Card -->
        <a href="pages/student-portal.html" class="group flex flex-col items-center rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm transition-all hover:border-blue-500 hover:shadow-md">
          <div class="mb-4 rounded-full bg-blue-50 p-4 text-blue-600 group-hover:bg-blue-100 group-hover:text-blue-700">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
            </svg>
          </div>
          <h2 class="text-xl font-semibold text-slate-900">Student Portal</h2>
          <p class="mt-2 text-sm text-slate-500">Login with Admission Number to check scores and materials.</p>
        </a>

        <!-- Parent Card -->
        <a href="pages/parent-portal.html" class="group flex flex-col items-center rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm transition-all hover:border-green-500 hover:shadow-md">
          <div class="mb-4 rounded-full bg-green-50 p-4 text-green-600 group-hover:bg-green-100 group-hover:text-green-700">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
            </svg>
          </div>
          <h2 class="text-xl font-semibold text-slate-900">Parent Portal</h2>
          <p class="mt-2 text-sm text-slate-500">Track your child's attendance, exams, and fee status.</p>
        </a>

        <!-- Admin Card -->
        <button id="show-admin-login" class="group flex flex-col items-center rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm transition-all hover:border-slate-800 hover:shadow-md focus:outline-none">
          <div class="mb-4 rounded-full bg-slate-100 p-4 text-slate-700 group-hover:bg-slate-200 group-hover:text-slate-900">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <h2 class="text-xl font-semibold text-slate-900">Admin / Staff</h2>
          <p class="mt-2 text-sm text-slate-500">Manage admissions, payments, and portal records.</p>
        </button>

      </div>

      <!-- Admin Login Form (Hidden by default) -->
      <div id="admin-login-section" class="mx-auto hidden w-full max-w-sm">
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          
          <div class="mb-6 flex items-center justify-between">
            <h3 class="text-lg font-semibold text-slate-900">Admin Sign In</h3>
            <button id="back-to-roles" class="text-sm font-medium text-slate-500 hover:text-slate-900 focus:outline-none">&larr; Back</button>
          </div>

          <!-- Error banner -->
          <div id="alert" role="alert" aria-live="polite" class="mb-5 hidden items-start gap-2.5 rounded-md border border-red-200 bg-red-50 px-3 py-2.5 text-sm text-red-800">
            <svg class="mt-0.5 h-4 w-4 shrink-0 text-red-600" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10A8 8 0 112 10a8 8 0 0116 0zm-8-4a1 1 0 00-1 1v3a1 1 0 002 0V7a1 1 0 00-1-1zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
            </svg>
            <p id="alert-message" class="flex-1 leading-5"></p>
            <button type="button" id="alert-close" class="-mr-1 rounded p-0.5 text-red-500 hover:text-red-700 focus:outline-none" aria-label="Dismiss">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <form id="login-form" class="space-y-4" novalidate>
            <div>
              <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="admin@coaching.com"
                class="block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 transition focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900" />
            </div>

            <div>
              <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
              <div class="relative">
                <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"
                  class="block w-full rounded-md border border-slate-300 bg-white py-2 pl-3 pr-10 text-sm text-slate-900 placeholder-slate-400 transition focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                <button type="button" id="toggle-password" aria-label="Show password"
                  class="absolute inset-y-0 right-0 flex items-center rounded-r-md px-3 text-slate-400 transition hover:text-slate-600 focus:outline-none">
                  <svg id="icon-eye" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                  <svg id="icon-eye-off" class="hidden h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                </button>
              </div>
            </div>

            <button type="submit" id="submit-btn"
              class="mt-2 flex w-full items-center justify-center gap-2 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800 active:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:opacity-80">
              <svg id="spinner" class="hidden h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
              <span id="btn-label">Sign in</span>
            </button>
          </form>
        </div>
      </div>

      <p class="mt-12 text-center text-xs text-slate-400">&copy; <span id="year"></span> <span id="footer-name">Your Coaching Institute Name</span></p>
    </div>
  </main>

  <script type="module">
    import { loginUser } from './js/auth.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    // UI Toggling Logic
    const roleSelection = document.getElementById('role-selection');
    const adminLoginSection = document.getElementById('admin-login-section');
    const showAdminBtn = document.getElementById('show-admin-login');
    const backToRolesBtn = document.getElementById('back-to-roles');

    showAdminBtn.addEventListener('click', () => {
      roleSelection.classList.add('hidden');
      adminLoginSection.classList.remove('hidden');
    });

    backToRolesBtn.addEventListener('click', () => {
      adminLoginSection.classList.add('hidden');
      roleSelection.classList.remove('hidden');
    });

    // Login Form Logic
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const spinner = document.getElementById('spinner');
    const alertBox = document.getElementById('alert');
    const alertMsg = document.getElementById('alert-message');
    const alertClose = document.getElementById('alert-close');
    const togglePassword = document.getElementById('toggle-password');
    const iconEye = document.getElementById('icon-eye');
    const iconEyeOff = document.getElementById('icon-eye-off');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      iconEye.classList.toggle('hidden', isPassword);
      iconEyeOff.classList.toggle('hidden', !isPassword);
    });

    alertClose.addEventListener('click', () => {
      alertBox.classList.add('hidden');
      alertBox.classList.remove('flex');
    });

    function showError(msg) {
      alertMsg.textContent = msg;
      alertBox.classList.remove('hidden');
      alertBox.classList.add('flex');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      alertBox.classList.remove('flex');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both your email and password.');
        return;
      }

      submitBtn.disabled = true;
      spinner.classList.remove('hidden');
      btnLabel.textContent = 'Signing in…';

      try {
        await loginUser(email, password);
      } catch (err) {
        showError(err.message || 'Invalid email or password.');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
        btnLabel.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
